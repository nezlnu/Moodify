{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="{% static 'main.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>


<body>

    <!-- navigācijas pogas -->

  <header>

    <nav>
      
      
      <a href="library.html" title="Library" class="nav-item">
          <i class="fa-solid fa-music"></i>
          <span class="tooltip">Library</span>
      </a>

      <a href="index.html" title="Home" class="nav-item">
          <i class="fa-solid fa-house"></i>
          <span class="tooltip">Home</span>
      </a>

      <a href="profile.html" title="Profile" class="nav-item">
          <i class="fa-solid fa-user"></i>
          <span class="tooltip">Profile</span>
      </a>
    </nav>

  </header>

    <div id="user_enter">{% if user.is_authenticated %}<a href="profile.html">{{ user.username }}</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>{% else %}<button id="reg_btn" onclick="location.href='register.html'">Register</button><button id="log_btn" onclick="location.href='login.html'">Login</button>{% endif %}</div>

     <main class="auth-container"><h1>Create your Moodify account</h1><p>Music for the way you feel.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Create account</button></form><p><a href="login.html">Already have an account? Log in</a></p><a href="index.html">Continue as a guest</a></main>

    
</body>
</html>
