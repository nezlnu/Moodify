{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>


    <header>

        <nav>
        
        <a href="library.html" title="Library" class="nav-item">
            <i class="fa-solid fa-music"></i>
            <span class="tooltip">Library</span>
        </a>

        <a href="index.html" title="Home" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span class="tooltip">Home</span>
        </a>

        <a href="profile.html" title="Profile" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span class="tooltip">Profile</span>
        </a>
        </nav>

    </header>

      <div id="user_enter">{% if user.is_authenticated %}<a href="profile.html">{{ user.username }}</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>{% else %}<button id="reg_btn" onclick="location.href='register.html'">Register</button><button id="log_btn" onclick="location.href='login.html'">Login</button>{% endif %}</div>


    
<main class="auth-container"><h1>Your Moodify account</h1><p>Username: <strong>{{ user.username }}</strong></p><p>Email: {{ user.email }}</p><p>Joined: {{ user.date_joined|date:"d M Y" }}</p><a href="library.html">View your listening history</a></main></body>


</html>
